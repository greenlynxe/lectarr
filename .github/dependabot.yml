version: 2
updates:
  # Frontend (yarn) — grouped weekly PRs, security fixes arrive as they come
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Backend (.NET / NuGet)
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: weekly
  - package-ecosystem: "docker"
    directory: "/deploy/rreading-glasses"
    schedule:
      interval: weekly
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: weekly

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
