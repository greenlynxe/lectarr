---
# Cardigann-style definition to search Anna's Archive from Prowlarr and
# route grabs through annas-bridge's SABnzbd shim. Import via Prowlarr →
# Settings → Indexers → Add → (custom). Set the two {{ }} placeholders.
#
# This defines AA as a usenet-protocol indexer so its "download" link is
# handed to the SABnzbd client (the bridge) via addurl, which then does
# the real HTTP download. Adjust selectors against the live site.
id: annas-archive-bridge
name: Anna's Archive (bridge)
description: "Anna's Archive via annas-bridge direct download"
language: en-US
type: public
protocol: usenet
encoding: UTF-8

settings:
  - name: bridge_url
    type: text
    label: annas-bridge base URL
    default: "http://annas-bridge:8790"
  - name: bridge_apikey
    type: text
    label: annas-bridge API key

links:
  - https://annas-archive.org/

caps:
  categorymappings:
    - {id: fiction, cat: Books/EBook, desc: "Ebooks"}
  modes:
    search: [q]
    book-search: [q, author, title]

search:
  paths:
    - path: "/search"
      response:
        type: html
  inputs:
    q: "{{ .Keywords }}"
    ext: epub
  rows:
    selector: "a[href*=\"/md5/\"]"
  fields:
    md5:
      selector: "a[href*=\"/md5/\"]"
      attribute: href
      filters:
        - name: regexp
          args: "/md5/([a-f0-9]{32})"
    title:
      selector: "h3"
    download:
      # The grab link points at the bridge, which performs the real download.
      text: "{{ .Config.bridge_url }}/grab?source=annas&id={{ .Result.md5 }}&ext=epub&apikey={{ .Config.bridge_apikey }}"
    category:
      text: fiction
