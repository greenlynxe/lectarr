# Z-Library. Its search results are <z-bookcard> web components whose
# attributes carry everything — including the direct `download` link, so
# no second fetch is needed to resolve. Anonymous where the mirror serves
# the /dl link; a session cookie lifts the daily quota.
key: zlib
name: Z-Library
enabled: true
base_url: ${ZLIB_BASE_URL:-https://z-lib.gd}

# headers:
#   Cookie: "${ZLIB_COOKIE}"

search:
  path: /s/{query}             # {query} in the path → not added as a param
  # Named groups: id = the /dl download path (used directly by resolve),
  # lang/ext/size from the card attributes, title/author from the slots.
  row_pattern: >-
    <z-bookcard\s+[^>]*?download="(?P<id>[^"]+)"[^>]*?language="(?P<lang>[^"]*)"[^>]*?extension="(?P<ext>[^"]*)"[^>]*?filesize="(?P<size>[^"]*)"[^>]*?>.*?<div slot="title">(?P<title>[^<]*)</div>\s*<div slot="author">(?P<author>[^<]*)</div>
  language_map:
    english: en
    french: fr
    français: fr
    spanish: es
    german: de
    italian: it

# The download link is already in the card, so resolve is a passthrough.
resolve:
  steps: []
  result: "{base_url}{id}"
